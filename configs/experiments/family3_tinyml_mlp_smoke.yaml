experiment:
  name: family3_tinyml_mlp_smoke
  mode: smoke
  task: family_3
  model: tinyml_mlp
  seed: 42

data:
  batch_size: 4096
  num_workers: 0

training:
  max_epochs: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  patience: 2
  min_delta: 0.0001
  torch_threads: 4
  weight_scheme: inverse_square_root_frequency_mean1

  # Smoke testte veri setinin yalnızca bir bölümü işlenir.
  max_train_batches: 20
  max_validation_batches: 10

output:
  directory: results/experiments/smoke_family3_tinyml_mlp
  overwrite: true